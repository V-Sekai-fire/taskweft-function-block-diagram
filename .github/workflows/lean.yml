# The Lean build and the fixtures: the reference diagram must check, plan and emit
# from its XML, its text form and its lifted guest, and the three must agree; the
# scan controller must round-trip through all three forms, simulate identically
# from each, and its enumerated harness must simulate on every trace; every
# control must be refused by name. A gate that passes on a control is decoration,
# so each refusal is asserted. The Godot half (scripts/diff_scan.sh) runs on a desk.
name: lean

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Lean 4.30.0
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain leanprover/lean4:v4.30.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build
        run: lake build
      - name: Reference diagram checks, plans and emits
        run: |
          B=./.lake/build/bin/taskweft_fbd_compiler
          "$B" check fixtures/write_hello.plcopen.xml
          "$B" plan fixtures/write_hello.plcopen.xml | grep -q "\"WRITE_FILE#3\""
          "$B" emit fixtures/write_hello.plcopen.xml /tmp/write_hello.sgd
          grep -q "func pending" /tmp/write_hello.sgd
      - name: The text form and the lifted guest agree with the XML
        run: |
          B=./.lake/build/bin/taskweft_fbd_compiler
          "$B" to-dsl fixtures/write_hello.plcopen.xml > /tmp/rt.fbd
          diff /tmp/rt.fbd fixtures/write_hello.fbd
          "$B" to-xml fixtures/write_hello.fbd > /tmp/rt.xml
          diff /tmp/rt.xml fixtures/write_hello.plcopen.xml
          "$B" plan fixtures/write_hello.plcopen.xml > /tmp/p_xml.json
          "$B" plan fixtures/write_hello.fbd > /tmp/p_fbd.json
          "$B" plan fixtures/write_hello.sgd > /tmp/p_sgd.json
          diff /tmp/p_xml.json /tmp/p_fbd.json
          diff /tmp/p_xml.json /tmp/p_sgd.json
          "$B" to-dsl fixtures/write_hello.sgd | diff - fixtures/write_hello.fbd
      - name: The control is refused
        run: |
          B=./.lake/build/bin/taskweft_fbd_compiler
          if "$B" check fixtures/loose_soup.xml; then echo "the control parsed; the parser is decoration"; exit 1; fi
          if "$B" plan fixtures/unwired_pin.fbd; then echo "the unwired pin lowered; the lowering is decoration"; exit 1; fi
          if "$B" check fixtures/unknown_block.fbd; then echo "the unknown block parsed; the text reader is decoration"; exit 1; fi
          if "$B" check fixtures/unknown_kind.sgd; then echo "the unknown kind lifted; the lift is decoration"; exit 1; fi
      - name: A CALL block is checked against the signature tables, lowers to a call step, and lifts back
        run: |
          B=./.lake/build/bin/taskweft_fbd_compiler
          "$B" sigs | grep -q "godot_engine_single.sigs: 60"
          "$B" sigs | grep -q "mjlab_trainer.sigs: 38"
          "$B" sigs Node3D.get_position | grep -q -- "-> Vector3"
          "$B" check fixtures/api/move_body.fbd
          "$B" plan fixtures/api/move_body.fbd | grep -q '"command": "Node3D.set_position"'
          "$B" plan fixtures/api/move_body.fbd | grep -q '"path": "#3.RET"'
          "$B" emit fixtures/api/move_body.fbd /tmp/move_body.sgd
          diff /tmp/move_body.sgd fixtures/api/move_body.sgd
          "$B" to-dsl fixtures/api/move_body.sgd | diff - fixtures/api/move_body.fbd
          "$B" to-xml fixtures/api/move_body.fbd | diff - fixtures/api/move_body.plcopen.xml
          "$B" to-dsl fixtures/api/move_body.plcopen.xml | diff - fixtures/api/move_body.fbd
          if "$B" plan fixtures/api/unknown_sig.fbd; then echo "the unknown signature lowered; the table check is decoration"; exit 1; fi
          if "$B" plan fixtures/api/missing_arg.fbd; then echo "the missing argument lowered; the table check is decoration"; exit 1; fi
      - name: The scan controller agrees across its three forms and simulates the same from each
        run: |
          B=./.lake/build/bin/taskweft_fbd_compiler
          F=fixtures/scan
          "$B" check "$F/walk_ctl.fbd" | grep -q "scan controller, 9 block"
          "$B" to-xml "$F/walk_ctl.fbd" | diff - "$F/walk_ctl.plcopen.xml"
          "$B" to-dsl "$F/walk_ctl.plcopen.xml" | diff - "$F/walk_ctl.fbd"
          "$B" emit-scan "$F/walk_ctl.fbd" /tmp/walk_ctl.sgd
          diff /tmp/walk_ctl.sgd "$F/walk_ctl.sgd"
          "$B" to-dsl "$F/walk_ctl.sgd" | diff - "$F/walk_ctl.fbd"
          "$B" emit-scan "$F/walk_ctl.sgd" /tmp/re.sgd
          diff /tmp/re.sgd "$F/walk_ctl.sgd"
          "$B" sim "$F/walk_ctl.fbd" "$F/walk_trace.json" | diff - "$F/walk_expected.jsonl"
          "$B" sim "$F/walk_ctl.plcopen.xml" "$F/walk_trace.json" | diff - "$F/walk_expected.jsonl"
          "$B" sim "$F/walk_ctl.sgd" "$F/walk_trace.json" | diff - "$F/walk_expected.jsonl"
          "$B" sim "$F/mux_range.fbd" "$F/mux_trace.json" | grep -q '"fault":"MUX#5: K=7 outside IN0..IN2"'
      - name: The planner's greet plan lifts into a controller that holds and releases
        run: |
          B=./.lake/build/bin/taskweft_fbd_compiler
          F=fixtures/scan
          "$B" to-dsl "$F/greet_plan.sgd" | diff - "$F/greet.fbd"
          "$B" emit-scan "$F/greet.fbd" /tmp/greet.sgd
          diff /tmp/greet.sgd "$F/greet.sgd"
          "$B" sim "$F/greet.fbd" "$F/greet_trace.json" | diff - "$F/greet_expected.jsonl"
          sed -n '2p' "$F/greet_expected.jsonl" | grep -q '"style":3'
          sed -n '22p' "$F/greet_expected.jsonl" | grep -q '"style":0'
      - name: The scan controls are refused by name
        run: |
          B=./.lake/build/bin/taskweft_fbd_compiler
          F=fixtures/scan
          refuse() { if "$B" check "$1" 2>/tmp/err; then echo "$1 was accepted; the gate is decoration"; exit 1; fi; grep -q "$2" /tmp/err || { echo "$1: wrong refusal:"; cat /tmp/err; exit 1; }; }
          refuse "$F/comb_cycle.plcopen.xml" "combinational cycle"
          refuse "$F/type_mismatch.fbd" "expected BOOL"
          refuse "$F/out_is_in.fbd" "is an input"
          refuse "$F/no_output.fbd" "writes no output"
          refuse "$F/edited_body.sgd" "tick body differs from NET"
          refuse "$F/negative/ton_off_by_one.sgd" "tick body differs from NET"
      - name: The enumerated harness simulates on every trace
        run: |
          B=./.lake/build/bin/taskweft_fbd_compiler
          "$B" gen-scan /tmp/gen | grep -q "harness controller"
          n=0
          for fbd in /tmp/gen/*.fbd; do
            "$B" emit-scan "$fbd" /tmp/gen/$(basename "$fbd" .fbd).sgd >/dev/null
            for trace in /tmp/gen/trace_*.json; do
              "$B" sim "$fbd" "$trace" > /tmp/gen/out.jsonl
              lines=$(wc -l < /tmp/gen/out.jsonl)
              [ "$lines" -eq 12 ] || { echo "$fbd on $trace: $lines line(s), expected 12"; exit 1; }
              n=$((n + 1))
            done
          done
          echo "$n harness x trace pair(s) simulated"
          [ "$n" -ge 700 ] || { echo "too few pairs: $n"; exit 1; }
